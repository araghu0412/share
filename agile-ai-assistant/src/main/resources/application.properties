spring.application.name=agile-ai-assistant
server.port=8080

rally.data-dir=./data

# Local semantic embedding model. Spring AI runs this ONNX model inside this JVM.
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.onnx.model-uri=https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=./data/model-cache

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma3:4b
spring.ai.ollama.chat.options.temperature=0

# Minimum cosine similarity accepted for semantic RAG/HYBRID matches.
rally.search.minimum-similarity-score=0.40
